<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <meta name="x-apple-disable-message-reformatting">
  <title>Your sign-in code</title>
  <style type="text/css">
    :root { color-scheme: light only; supported-color-schemes: light only; }
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; display: block; }
    /* Ask clients that honour this to keep our colours. */
    @media (prefers-color-scheme: dark) {
      .rs-body, .rs-body-table { background-color: #3562f5 !important; }
      .rs-card, .rs-card-inner { background-color: #ffffff !important; }
      .rs-ink { color: #0f1b3d !important; }
      .rs-soft { color: #5a6485 !important; }
      .rs-faint { color: #8a93ae !important; }
      .rs-code-wrap { background-color: #f3f6fe !important; }
      .rs-code { color: #0f1b3d !important; }
      .rs-foot, .rs-foot a { color: #ffffff !important; }
    }
    @media only screen and (max-width: 620px) {
      .rs-outer { padding: 20px 12px !important; }
      .rs-card { padding: 26px 18px 22px !important; border-radius: 20px !important; }
      .rs-logo { width: 148px !important; height: auto !important; }
      .rs-h { font-size: 22px !important; letter-spacing: -0.4px !important; }
      .rs-code { font-size: 28px !important; letter-spacing: 0.18em !important; }
      .rs-code-wrap { padding: 16px 10px !important; }
      .rs-body-copy { font-size: 14px !important; }
      .rs-foot { font-size: 11px !important; padding-top: 16px !important; }
    }
  </style>
  <!--[if mso]>
  <style type="text/css">
    body, table, td { font-family: Arial, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body class="rs-body" bgcolor="#3562f5" style="margin:0;padding:0;background-color:#3562f5;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#3562f5;opacity:0;">
    {{ .Token }} is your Resurface code.
  </div>
  <table role="presentation" class="rs-body-table" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#3562f5" style="background-color:#3562f5;width:100%;">
    <tr>
      <td align="center" class="rs-outer" style="padding:36px 14px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;width:100%;">
          <!-- White lockup sits on the field, not inside the card — dark-mode
               inversions that charcoal the card then can't hide the wordmark. -->
          <tr>
            <td align="center" style="padding:0 0 18px;">
              <a href="https://tryresurface.com" style="text-decoration:none;">
                <img class="rs-logo" src="https://app.tryresurface.com/logo-lockup-white.png" width="168" height="44" alt="Resurface" style="display:block;width:168px;max-width:70%;height:auto;margin:0 auto;border:0;">
              </a>
            </td>
          </tr>
          <tr>
            <td class="rs-card" bgcolor="#ffffff" style="background-color:#ffffff;border-radius:24px;padding:32px 28px 28px;">
              <!-- Nested table + bgcolor: Gmail dark mode often leaves these alone. -->
              <table role="presentation" class="rs-card-inner" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="background-color:#ffffff;">
                <tr>
                  <td class="rs-h rs-ink" style="font-family:Poppins,Arial,Helvetica,sans-serif;font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-0.5px;color:#0f1b3d;padding-bottom:10px;">
                    Your sign-in code
                  </td>
                </tr>
                <tr>
                  <td class="rs-body-copy rs-soft" style="font-family:Poppins,Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;line-height:1.55;color:#5a6485;padding-bottom:6px;">
                    <p style="margin:0 0 16px;">Enter this code in Resurface. It expires shortly and only works once.</p>
        <div class="rs-code-wrap" style="margin:10px 0 2px;padding:18px 12px;background-color:#f3f6fe;border-radius:16px;text-align:center;" bgcolor="#f3f6fe">
    <div class="rs-code" style="font-family:Poppins,Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;letter-spacing:0.22em;color:#0f1b3d;font-variant-numeric:tabular-nums;line-height:1.2;">
      {{ .Token }}
    </div>
  </div>
                  </td>
                </tr>
                
                <tr>
                  <td class="rs-faint" style="font-family:Poppins,Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#8a93ae;padding-top:20px;">
                    If you didn't ask for this, you can ignore the email.
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" class="rs-foot" style="padding:18px 8px 0;font-family:Poppins,Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#ffffff;">
              Built for UK medical students.<br>
              <a href="https://app.tryresurface.com" style="color:#ffffff;text-decoration:underline;">app.tryresurface.com</a>
              &nbsp;·&nbsp;
              <a href="https://tryresurface.com" style="color:#ffffff;text-decoration:underline;">tryresurface.com</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
